<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle / Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.6" />

  <!-- Outer Concentric Target Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="8 6" opacity="0.45" />

  <!-- Inner Concentric Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#primaryGrad)" stroke-width="16" opacity="0.75" />

  <!-- Core Target Disc -->
  <circle cx="256" cy="256" r="85" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- High-Energy Lightning Bolt -->
  <path d="M280 135 L190 275 L250 275 L232 375 L325 235 L265 235 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Star Embellishments -->
  <path d="M125 150 L132 168 L150 175 L132 182 L125 200 L118 182 L100 175 L118 168 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M387 340 L392 352 L405 357 L392 362 L387 375 L382 362 L370 357 L382 352 Z" fill="#f59e0b" opacity="0.85" />
</svg>
